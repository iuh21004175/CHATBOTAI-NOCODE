{% extends "base.html" %}
{% block title %}Tạo tài khoản{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <a href="{{ url_for('auth.login') }}" class="auth-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Quay lại
    </a>

    <div class="auth-logo">
      <div class="auth-logo-badge">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M12 2.2c.9 2.4-1.6 4-1.9 6.6-.3 2.7 1.6 4.9 4.1 4.9 2.3 0 3.9-1.8 3.9-4 0-1-.4-1.8-.8-2.4 1 1.8.1 3.8-1.7 3.8a2.4 2.4 0 0 1-2.4-2.5c0-2.1 2-3 1.6-5.1C14.4 1.6 12 2.2 12 2.2z"></path><ellipse cx="12" cy="19.5" rx="6.5" ry="2.3"></ellipse></svg>
      </div>
    </div>

    <h1 class="auth-title">Tạo tài khoản</h1>
    <p class="auth-subtitle">Bắt đầu quản lý chatbot AI của bạn</p>

    <form method="post" action="{{ url_for('auth.register') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="field-group">
        <label class="field-label" for="full_name">Họ tên</label>
        <input class="field" type="text" id="full_name" name="full_name" placeholder="Nguyễn Văn A" value="{{ full_name or '' }}" required>
      </div>

      <div class="field-group">
        <label class="field-label" for="team_name">Tên team/công ty</label>
        <input class="field" type="text" id="team_name" name="team_name" placeholder="VD: Công ty ABC (tùy chọn)" value="{{ team_name or '' }}">
      </div>

      <div class="field-group">
        <label class="field-label" for="email">Email</label>
        <input class="field" type="email" id="email" name="email" placeholder="name@example.com" value="{{ email or '' }}" required>
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Mật khẩu</label>
        <input class="field" type="password" id="password" name="password" placeholder="Tối thiểu 8 ký tự" required minlength="8">
      </div>

      <div class="field-group">
        <label class="field-label" for="confirm_password">Nhập lại mật khẩu</label>
        <input class="field" type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required minlength="8">
      </div>

      {% if error %}
        <p class="field-error">{{ error }}</p>
      {% endif %}

      <button class="primary" type="submit">Tạo tài khoản</button>
    </form>

    <p class="auth-footer">Đã có tài khoản? <a href="{{ url_for('auth.login') }}">Đăng nhập</a></p>
  </div>
</div>
{% endblock %}
