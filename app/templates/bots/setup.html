{% extends "bot_workspace.html" %}
{% block title %}Thiết lập — {{ bot.name }}{% endblock %}
{% block workspace_extra_css %}
<style>
#engine-card [hidden]{display:none !important;} /* .toggle-row đặt display:flex nên thuộc tính hidden mặc định không đủ */
/* ---- Chọn mẫu trợ lý ---- */
.tpl-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.tpl{display:flex;flex-direction:column;gap:10px;text-align:left;padding:16px;border:1.5px solid var(--border);border-radius:12px;background:#fff;cursor:pointer;font-family:inherit;color:var(--text);min-width:0;}
.tpl:hover{border-color:#A7C5EA;}
.tpl[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 1px var(--text) inset;}
.tpl:focus-visible,.ed-btn:focus-visible,.btn-opt:focus-visible,.ins-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.tpl-top{display:flex;align-items:center;gap:10px;min-width:0;}
.tpl-ico{width:36px;height:36px;border-radius:10px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text);}
.tpl-name{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tpl-desc{font-size:12.5px;line-height:1.5;color:var(--text-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tpl-collapse{border-style:dashed;align-items:center;justify-content:center;text-align:center;background:transparent;}
.tpl-collapse .tpl-name{font-size:14px;}
.tpl-note{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);font-size:12.5px;font-weight:600;}
.tpl-grid[hidden],.tpl-note[hidden]{display:none;}

/* ---- Khung chỉ dẫn (trình soạn markdown) ---- */
.ins-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.ins-head .card-title{margin:0;}
.ins-toggle{width:32px;height:32px;border:none;background:transparent;border-radius:8px;color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ins-toggle svg{transition:transform .15s;}
.ins-toggle[aria-expanded="false"] svg{transform:rotate(180deg);}
.ins-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
.ins-bar .lbl{display:inline;margin:0 10px 0 0;}
.counter{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid #FDE68A;background:#FEF9C3;color:#854D0E;}
.counter.ok{border-color:var(--border);background:#F8FAFC;color:var(--text-soft);}
.counter.warn{border-color:#FDBA74;background:var(--amber-bg);color:var(--amber-text);}
.counter.over{border-color:var(--error-border);background:var(--error-bg);color:var(--error-text);}
.btn-opt{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:none;border-radius:10px;background:var(--text);color:#fff;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;}
.btn-opt:hover{background:#1E293B;}
.btn-opt:disabled{opacity:.6;cursor:wait;}
.ed{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;}
.ed-tools{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:8px 10px;background:#F6F7F9;border-bottom:1px solid var(--border);}
.ed-tools select{height:34px;padding:0 6px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px;font-weight:700;font-family:inherit;margin-right:6px;cursor:pointer;}
.ed-btn{width:34px;height:34px;border:none;background:transparent;border-radius:8px;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;}
.ed-btn:hover{background:#E8ECF2;}
.ed-btn b,.ed-btn i{font-size:15px;line-height:1;}
.ed-area{display:flex;height:320px;min-height:200px;max-height:720px;resize:vertical;overflow:hidden;position:relative;}
.ed-gutter{width:48px;flex-shrink:0;overflow:hidden;border-right:1px solid var(--border);background:#fff;color:#8A94A6;user-select:none;}
.ed-gutter-in{padding:12px 10px 12px 0;text-align:right;font:13px/22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;will-change:transform;}
.ed-wrap{position:relative;flex:1;min-width:0;}
.ed-wrap textarea,.ed-mirror{font:13px/22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:12px 14px;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:2;}
.ed-wrap textarea{width:100%;height:100%;border:0;outline:none;resize:none;display:block;background:transparent;color:var(--text);}
.ed-mirror{position:absolute;top:0;left:0;visibility:hidden;pointer-events:none;}
.ed-msg{margin-top:10px;font-size:12.5px;font-weight:600;}
.ed-msg.err{color:var(--error-text);}
.ed-msg.ok{color:var(--green-text);}
.ed-msg button{border:none;background:none;color:var(--accent-dark);font-weight:700;font-family:inherit;cursor:pointer;text-decoration:underline;padding:0 0 0 6px;}
[hidden]{display:none !important;}
/* ---- Icon ? giải thích (tooltip hiện khi rê chuột hoặc focus bằng bàn phím) ---- */
.lbl-row{display:flex;align-items:center;margin-bottom:7px;}
.lbl-row .lbl{margin:0;display:inline;}
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:16px;height:16px;margin-left:6px;border-radius:50%;background:#E2E8F0;color:var(--text-soft);font-size:11px;font-weight:700;line-height:1;cursor:help;vertical-align:middle;user-select:none;}
.tip:hover,.tip:focus{background:var(--text);color:#fff;outline:none;}
.tip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.tip-body{display:none;position:absolute;left:-8px;top:calc(100% + 8px);z-index:30;width:340px;max-width:calc(100vw - 64px);padding:10px 12px;border-radius:10px;background:#0F172A;color:#fff;font-size:12px;font-weight:400;line-height:1.55;text-align:left;box-shadow:0 8px 24px rgba(15,23,42,.25);cursor:default;}
.tip:hover .tip-body,.tip:focus .tip-body{display:block;}
.tip-line{display:block;margin-top:6px;}
.tip-line b{font-weight:700;}
.tip-meta{color:#94A3B8;font-size:11.5px;}
.slider-row{display:flex;align-items:center;gap:12px;}
.slider-row input[type=range]{flex:1;min-width:0;accent-color:var(--black);}
.slider-end{font-size:11px;color:var(--text-faint);white-space:nowrap;}
.slider-val{min-width:40px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
.eng-sep{margin:20px 0 16px;border-top:1px solid var(--border);}
/* ---- Chi phí ước tính mỗi câu hỏi (dính đáy vùng cuộn khi card đang hiển thị) ---- */
.cost-box{position:sticky;bottom:0;z-index:20;margin:20px -20px -20px;padding:12px 20px 14px;border-top:1px solid var(--border);border-radius:0 0 14px 14px;background:#F8FAFC;box-shadow:0 -6px 16px rgba(15,23,42,.06);}
.cost-head{display:flex;align-items:center;font-size:13px;font-weight:700;margin-bottom:8px;}
.cost-box .tip-body{top:auto;bottom:calc(100% + 8px);}
.cost-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.cost-cell-label{font-size:11.5px;color:var(--text-faint);}
.cost-cell-val{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
.cost-cell-val.dim{font-weight:600;}
.cost-sub{margin-top:6px;font-size:12px;color:var(--text-faint);}
.cost-err{font-size:13px;font-weight:600;color:var(--error-text);}
.cost-box.loading .cost-grid,.cost-box.loading .cost-sub{opacity:.55;}
.cost-details{margin-top:8px;font-size:12.5px;}
.cost-details summary{cursor:pointer;font-weight:700;color:var(--accent-dark);}
.cost-detail-body{max-height:40vh;overflow:auto;margin-top:8px;}
.cost-table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;}
.cost-table th,.cost-table td{padding:4px 0 4px 10px;text-align:right;border-bottom:1px solid #EEF2F7;}
.cost-table th:first-child,.cost-table td:first-child{padding-left:0;text-align:left;}
.cost-table thead th{font-weight:700;color:var(--text-soft);}
.cost-table tr.total td,.cost-table tr.total th{font-weight:700;}
.cost-notes{margin:10px 0 0;padding-left:18px;color:var(--text-soft);line-height:1.55;}
.cost-notes li{margin-bottom:4px;}
@media (max-width:640px){.ins-bar{flex-wrap:wrap;}}
</style>
{% endblock %}
{% block topbar_actions %}
<button type="submit" form="setup-form" class="btnp">
  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
  Lưu thay đổi
</button>
{% endblock %}
{% block main %}
{# tip: icon ? kèm tooltip, nội dung là phần thân của {% call %}; lbl: nhãn + icon ? (icon nằm ngoài <label> để bấm vào không kích hoạt ô nhập).
   Lưu ý: gọi caller() trong lbl trước khi mở {% call tip %} — trong thân {% call %} biến `caller` không còn trỏ tới caller của lbl. #}
{% macro tip(tip_id, label) %}<span class="tip" tabindex="0" role="note" aria-label="Giải thích: {{ label }}" aria-describedby="{{ tip_id }}">?<span class="tip-body" role="tooltip" id="{{ tip_id }}">{{ caller() }}</span></span>{% endmacro %}
{% macro lbl(for_id, text, style="") %}{% set body = caller() %}<div class="lbl-row"{% if style %} style="{{ style }}"{% endif %}><label class="lbl" for="{{ for_id }}">{{ text }}</label>{% call tip('tip-' ~ for_id, text) %}{{ body }}{% endcall %}</div>{% endmacro %}
<form id="setup-form" method="post" action="{{ url_for('dashboard.bot_setup', bot_id=bot.id) }}" class="ws-layout">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <div class="ws-layout-main">
    <div class="card" id="tpl-card">
      <div class="tpl-head">
        <div>
          <div class="card-title" style="margin-bottom:4px;">Chọn mẫu trợ lý</div>
          <div class="hint" style="margin:0;font-size:13.5px;color:var(--text-soft);">Bắt đầu với hành vi agent được cấu hình sẵn.</div>
        </div>
        <button type="button" class="btns" id="tpl-show" hidden>Hiện mẫu</button>
      </div>
      <div class="tpl-grid" id="tpl-grid">
        {% for t in template_list %}
        <button type="button" class="tpl" data-key="{{ t.key }}" aria-pressed="false">
          <span class="tpl-top">
            <span class="tpl-ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ t.icon|safe }}</svg></span>
            <span class="tpl-name" title="{{ t.name }}">{{ t.name }}</span>
          </span>
          <span class="tpl-desc">{{ t.description }}</span>
        </button>
        {% endfor %}
        <button type="button" class="tpl tpl-collapse" id="tpl-hide">
          <span class="tpl-ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></span>
          <span class="tpl-name">Thu gọn</span>
          <span class="tpl-desc">Ẩn mẫu</span>
        </button>
      </div>
      <div class="tpl-note" id="tpl-note" role="status" hidden></div>
    </div>

    <div class="card">
      <div style="display:flex;gap:16px;align-items:center;margin-bottom:20px;">
        <div style="width:64px;height:64px;border-radius:16px;background:#EC4899;color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">{{ bot.name[:2]|upper }}</div>
        <div style="flex-grow:1;">
          <label class="lbl" for="name">Tên trợ lý</label>
          <input class="field" type="text" id="name" name="name" value="{{ bot.name }}" required>
        </div>
      </div>
      <label class="lbl" for="greeting">Lời chào đầu tiên</label>
      <textarea class="field" id="greeting" name="greeting" rows="2" style="resize:vertical;">{{ settings.greeting or "" }}</textarea>
      <div class="hint">Muốn xem chatbox trông thế nào và chat thử? Vào <a href="{{ url_for('dashboard.bot_publish', bot_id=bot.id) }}" style="color:var(--accent-dark);font-weight:700;">Bước 3 — Xuất bản</a> (khung xem trước hiển thị tên, lời chào và ngôn ngữ đã lưu ở đây).</div>
    </div>

    <div class="card" id="ins-card">
      <div class="ins-head">
        <div class="card-title">Tùy chỉnh trợ lý của bạn</div>
        <button type="button" class="ins-toggle" id="ins-toggle" aria-expanded="true" aria-controls="ins-body" aria-label="Thu gọn hoặc mở rộng phần chỉ dẫn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
        </button>
      </div>
      <div id="ins-body">
        <div class="ins-bar">
          <div>
            <label class="lbl" for="instructions">Chỉ dẫn</label><span class="counter" id="ins-count" aria-live="polite">0 / {{ instructions_max }} ký tự</span>
          </div>
          <button type="button" class="btn-opt" id="ins-optimize" data-url="{{ url_for('dashboard.bot_optimize_instructions', bot_id=bot.id) }}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
            <span id="ins-optimize-label">Tối ưu</span>
          </button>
        </div>
        <div class="ed">
          <div class="ed-tools" role="toolbar" aria-label="Định dạng markdown">
            <select id="ed-heading" aria-label="Kiểu đoạn">
              <option value="p">P</option><option value="1">H1</option><option value="2">H2</option><option value="3">H3</option>
            </select>
            <button type="button" class="ed-btn" data-cmd="bold" title="Đậm (Ctrl+B)" aria-label="Đậm"><b>B</b></button>
            <button type="button" class="ed-btn" data-cmd="italic" title="Nghiêng (Ctrl+I)" aria-label="Nghiêng"><i>I</i></button>
            <button type="button" class="ed-btn" data-cmd="ul" title="Danh sách dấu đầu dòng" aria-label="Danh sách dấu đầu dòng"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg></button>
            <button type="button" class="ed-btn" data-cmd="ol" title="Danh sách đánh số" aria-label="Danh sách đánh số"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="21" y1="6" y2="6"/><line x1="10" x2="21" y1="12" y2="12"/><line x1="10" x2="21" y1="18" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg></button>
            <button type="button" class="ed-btn" data-cmd="task" title="Danh sách việc cần làm" aria-label="Danh sách việc cần làm"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg></button>
            <button type="button" class="ed-btn" data-cmd="link" title="Liên kết" aria-label="Liên kết"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
            <button type="button" class="ed-btn" data-cmd="quote" title="Trích dẫn" aria-label="Trích dẫn"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="none"><path d="M6.5 10c-.223 0-.437.034-.65.065.069-.232.14-.468.254-.68.114-.308.292-.575.469-.844.148-.291.409-.488.601-.737.201-.242.475-.403.692-.604.213-.21.492-.315.714-.463.232-.133.434-.28.65-.35l.539-.222.474-.197-.485-1.938-.597.144c-.191.048-.424.104-.689.171-.271.05-.56.187-.882.312-.318.142-.686.238-1.028.466-.344.218-.741.4-1.091.692-.339.301-.748.562-1.05.945-.33.358-.656.734-.909 1.162-.293.408-.492.856-.702 1.299-.19.443-.343.896-.468 1.336-.237.882-.343 1.72-.384 2.437-.034.718-.014 1.315.028 1.747.015.204.043.402.063.539l.025.168.026-.006A4.5 4.5 0 1 0 6.5 10zm11 0c-.223 0-.437.034-.65.065.069-.232.14-.468.254-.68.114-.308.292-.575.469-.844.148-.291.409-.488.601-.737.201-.242.475-.403.692-.604.213-.21.492-.315.714-.463.232-.133.434-.28.65-.35l.539-.222.474-.197-.485-1.938-.597.144c-.191.048-.424.104-.689.171-.271.05-.56.187-.882.312-.317.143-.686.238-1.028.467-.344.218-.741.4-1.091.692-.339.301-.748.562-1.05.944-.33.358-.656.734-.909 1.162-.293.408-.492.856-.702 1.299-.19.443-.343.896-.468 1.336-.237.882-.343 1.72-.384 2.437-.034.718-.014 1.315.028 1.747.015.204.043.402.063.539l.025.168.026-.006A4.5 4.5 0 1 0 17.5 10z"/></svg></button>
            <button type="button" class="ed-btn" data-cmd="code" title="Mã nội dòng" aria-label="Mã nội dòng"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
            <button type="button" class="ed-btn" data-cmd="codeblock" title="Khối mã" aria-label="Khối mã"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></svg></button>
            <button type="button" class="ed-btn" data-cmd="table" title="Bảng" aria-label="Bảng"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></svg></button>
          </div>
          <div class="ed-area" id="ed-area">
            <div class="ed-gutter" aria-hidden="true"><div class="ed-gutter-in" id="ed-gutter">1</div></div>
            <div class="ed-wrap">
              <div class="ed-mirror" id="ed-mirror" aria-hidden="true"></div>
              <textarea id="instructions" name="instructions" maxlength="{{ instructions_max }}" spellcheck="false" placeholder="Viết chỉ dẫn bằng mã markdown...">{{ settings.instructions or "" }}</textarea>
            </div>
          </div>
        </div>
        <div class="ed-msg" id="ed-msg" role="status" hidden></div>
        <div class="hint">Chỉ dẫn giúp AI hiểu vai trò, cách xưng hô và giới hạn khi trò chuyện với khách hàng. Chọn một mẫu ở trên để điền sẵn chỉ dẫn tối ưu, rồi chỉnh sửa theo doanh nghiệp của bạn. Thông tin cụ thể (giá, chính sách...) hãy đưa vào tài liệu ở Bước 2.</div>
      </div>
    </div>

    <div class="card" id="engine-card">
      <div class="card-title">Trả lời thông minh</div>

      {% call lbl('language', 'Ngôn ngữ') %}
        Ngôn ngữ trợ lý dùng để trả lời. Trợ lý luôn trả lời bằng ngôn ngữ này, kể cả khi khách hỏi hoặc tài liệu viết bằng ngôn ngữ khác.
      {% endcall %}
      <select class="field" id="language" name="language">
        <option value="vi" {{ "selected" if settings.language == "vi" else "" }}>Tiếng Việt</option>
        <option value="en" {{ "selected" if settings.language == "en" else "" }}>English</option>
      </select>

      {# temperature = 0 là giá trị hợp lệ ("Chính xác") — không dùng `or` vì 0.0 bị coi là rỗng #}
      {% set temp = settings.temperature if settings.temperature is not none else 0.7 %}
      {% call lbl('max_tokens', 'Token đầu ra tối đa', 'margin-top:18px;') %}
        Giới hạn độ dài một câu trả lời của AI (khoảng 1 token ≈ 3–4 ký tự tiếng Việt). Đây là mức trần: AI không bị ép viết cho đủ.
        <span class="tip-line"><b>Thấp (dưới ~200):</b> câu trả lời rất ngắn, có thể bị cắt cụt giữa chừng.</span>
        <span class="tip-line"><b>Vừa (~300–800):</b> đủ cho hầu hết câu hỏi chăm sóc khách hàng.</span>
        <span class="tip-line"><b>Cao (trên ~1000):</b> trả lời chi tiết, dài nhưng tốn chi phí và chậm hơn.</span>
      {% endcall %}
      <div class="slider-row">
        <span class="slider-end">10</span>
        <input type="range" id="max_tokens" name="max_tokens" min="10" max="3000" step="10" value="{{ settings.max_tokens or 500 }}">
        <span class="slider-end">3000</span>
        <output class="slider-val" id="max_tokens-value" for="max_tokens">{{ settings.max_tokens or 500 }}</output>
      </div>

      {% call lbl('temperature', 'Độ sáng tạo (temperature)', 'margin-top:18px;') %}
        Mức ngẫu nhiên khi AI chọn từ để viết câu trả lời.
        <span class="tip-line"><b>0 – 0,3 (chính xác):</b> ổn định, bám sát tài liệu và chỉ dẫn; hợp tư vấn giá, chính sách.</span>
        <span class="tip-line"><b>0,4 – 0,7 (cân bằng):</b> tự nhiên, linh hoạt mà vẫn đáng tin.</span>
        <span class="tip-line"><b>0,8 – 1 (sáng tạo):</b> đa dạng, giàu cảm xúc nhưng dễ diễn đạt lệch hoặc thêm ý ngoài tài liệu.</span>
      {% endcall %}
      <div class="slider-row">
        <span class="slider-end">0 (Chính xác)</span>
        <input type="range" id="temperature" name="temperature" min="0" max="1" step="0.1" value="{{ temp }}">
        <span class="slider-end">1 (Sáng tạo)</span>
        <output class="slider-val" id="temperature-value" for="temperature">{{ "%.1f"|format(temp) }}</output>
      </div>

      <div class="eng-sep"></div>

      {% call lbl('config_tier', 'Mức cấu hình') %}
        Chọn mức độ chi tiết của các thông số điều khiển cách AI ghi nhớ, tra cứu tài liệu và hỏi lại.
        {% for t in engine.tiers %}<span class="tip-line"><b>{{ t.name }}:</b> {{ t.desc }}</span>{% endfor %}
        <span class="tip-line">Thông số không nằm trong mức đang chọn luôn dùng giá trị mặc định của hệ thống — hạ mức không để lại giá trị ẩn.</span>
      {% endcall %}
      <select class="field" id="config_tier" name="config_tier">
        {% for t in engine.tiers %}
        <option value="{{ t.value }}" data-desc="{{ t.desc }}" {{ "selected" if engine.tier == t.value else "" }}>{{ t.label }}</option>
        {% endfor %}
      </select>
      <div class="hint" id="tier-desc" aria-live="polite">{% for t in engine.tiers %}{% if t.value == engine.tier %}{{ t.desc }}{% endif %}{% endfor %}</div>

      <div class="toggle-row" data-tiers="basic advanced">
        <div>
          <div class="toggle-row-title">Bộ nhớ hội thoại
            {% call tip('tip-memory_enabled', 'Bộ nhớ hội thoại') %}
              Ghi nhớ điều khách đã nói và tóm tắt khi hội thoại dài, để AI không quên phần đầu cuộc trò chuyện. Tắt: AI chỉ dựa vào các tin gần nhất.
            {% endcall %}
          </div>
          <div class="toggle-row-desc">Ghi nhớ điều khách đã nói và tóm tắt khi hội thoại dài</div>
        </div>
        <input type="checkbox" id="memory_enabled" name="memory_enabled" {{ "checked" if settings.structured_memory_enabled and settings.summary_enabled else "" }} style="display:none;">
        <button type="button" class="toggle {{ 'on' if settings.structured_memory_enabled and settings.summary_enabled else '' }}" data-toggle-target="memory_enabled" aria-label="Bộ nhớ hội thoại"><div class="dot"></div></button>
      </div>
      <div class="toggle-row" data-tiers="basic advanced expert">
        <div>
          <div class="toggle-row-title">Cơ sở tri thức (RAG)
            {% call tip('tip-rag_enabled', 'Cơ sở tri thức (RAG)') %}
              AI tra cứu các tài liệu bạn đã tải ở Bước 2 rồi dựa vào đó để trả lời (giá, chính sách, thông tin sản phẩm...). Tắt: AI chỉ trả lời bằng kiến thức chung và chỉ dẫn, không dùng tài liệu.
            {% endcall %}
          </div>
          <div class="toggle-row-desc">Tra cứu tài liệu ở Bước 2 để trả lời</div>
        </div>
        <input type="checkbox" id="rag_enabled" name="rag_enabled" {{ "checked" if settings.rag_enabled else "" }} style="display:none;">
        <button type="button" class="toggle {{ 'on' if settings.rag_enabled else '' }}" data-toggle-target="rag_enabled" aria-label="Cơ sở tri thức (RAG)"><div class="dot"></div></button>
      </div>
      <div class="toggle-row" data-tiers="basic advanced expert">
        <div>
          <div class="toggle-row-title">AI tự hỏi làm rõ
            {% call tip('tip-clarification_enabled', 'AI tự hỏi làm rõ') %}
              Khi câu hỏi mơ hồ hoặc chưa đủ thông tin, AI hỏi lại khách thay vì đoán. Tắt: AI luôn cố trả lời ngay, dễ đoán sai ý khách.
            {% endcall %}
          </div>
          <div class="toggle-row-desc">Hỏi lại khách khi chưa đủ thông tin thay vì đoán</div>
        </div>
        <input type="checkbox" id="clarification_enabled" name="clarification_enabled" {{ "checked" if settings.clarification_enabled else "" }} style="display:none;">
        <button type="button" class="toggle {{ 'on' if settings.clarification_enabled else '' }}" data-toggle-target="clarification_enabled" aria-label="AI tự hỏi làm rõ"><div class="dot"></div></button>
      </div>

      {% for f in engine.fields %}
      <div data-tiers="{{ 'advanced expert' if f.tier == 'advanced' else 'expert' }}" style="margin-top:14px;">
        {# Nhãn không in giá trị: giá trị đang chọn nằm ở ô nhập, hoặc ở ô hiển thị cạnh thanh trượt #}
        {% call lbl(f.name, f.label) %}
          {{ f.help }}
          {% if f.low %}<span class="tip-line"><b>Chỉnh nhỏ:</b> {{ f.low }}</span>{% endif %}
          {% if f.high %}<span class="tip-line"><b>Chỉnh lớn:</b> {{ f.high }}</span>{% endif %}
          {% if f.note %}<span class="tip-line">{{ f.note }}</span>{% endif %}
          <span class="tip-line tip-meta">Hợp lệ: {{ f.range_text }} · Mặc định hệ thống: {{ f.default_text }}</span>
        {% endcall %}
        {% if f.slider %}
        <div class="slider-row">
          <span class="slider-end">{{ f.min }} (Khắt khe)</span>
          <input type="range" id="{{ f.name }}" name="{{ f.name }}" min="{{ f.min }}" max="{{ f.max }}" step="{{ f.step }}" value="{{ f.value }}">
          <span class="slider-end">{{ f.max }} (Thoáng)</span>
          <output class="slider-val" id="{{ f.name }}-value" for="{{ f.name }}">{{ "%.2f"|format(f.value) }}</output>
        </div>
        {% else %}
        <input class="field" type="number" id="{{ f.name }}" name="{{ f.name }}" min="{{ f.min }}" max="{{ f.max }}" step="{{ f.step }}" value="{{ f.value }}">
        {% endif %}
      </div>
      {% endfor %}

      {% for name, title, desc, help in engine.expert_toggles %}
      <div class="toggle-row" data-tiers="expert">
        <div>
          <div class="toggle-row-title">{{ title }}
            {% call tip('tip-' ~ name, title) %}{{ help }}{% endcall %}
          </div>
          <div class="toggle-row-desc">{{ desc }}</div>
        </div>
        <input type="checkbox" id="{{ name }}" name="{{ name }}" {{ "checked" if settings[name] else "" }} style="display:none;">
        <button type="button" class="toggle {{ 'on' if settings[name] else '' }}" data-toggle-target="{{ name }}" aria-label="{{ title }}"><div class="dot"></div></button>
      </div>
      {% endfor %}

      <div data-tiers="expert" style="margin-top:14px;">
        {% call lbl('low_confidence_reply_mode', 'Khi không có thông tin phù hợp') %}
          Cách AI phản hồi khi không đoạn tài liệu nào đủ liên quan tới câu hỏi.
          <span class="tip-line"><b>Hỏi lại khách:</b> AI dùng câu hỏi lại bên dưới để khách nói rõ hơn; hợp khi câu hỏi có thể chỉ chưa đủ ý.</span>
          <span class="tip-line"><b>Từ chối lịch sự:</b> AI dùng câu từ chối bên dưới và không tự trả lời; hợp khi cần tránh trả lời ngoài phạm vi tài liệu.</span>
        {% endcall %}
        <select class="field" id="low_confidence_reply_mode" name="low_confidence_reply_mode">
          <option value="ask_clarify" {{ "selected" if settings.low_confidence_reply_mode == "ask_clarify" else "" }}>Hỏi lại khách</option>
          <option value="decline" {{ "selected" if settings.low_confidence_reply_mode == "decline" else "" }}>Từ chối lịch sự</option>
        </select>
        {% call lbl('low_confidence_clarify_message', 'Câu hỏi lại (để trống = câu mặc định)', 'margin-top:14px;') %}
          Câu bạn viết sẵn, được dùng nguyên văn khi tài liệu không có đoạn nào đủ liên quan và chế độ là "Hỏi lại khách" — AI không tự trả lời trong trường hợp đó. Để trống: dùng câu mặc định của hệ thống.
        {% endcall %}
        <textarea class="field" id="low_confidence_clarify_message" name="low_confidence_clarify_message" rows="2" maxlength="{{ engine.message_max }}" style="resize:vertical;">{{ settings.low_confidence_clarify_message or "" }}</textarea>
        {% call lbl('low_confidence_decline_message', 'Câu từ chối (để trống = câu mặc định)', 'margin-top:14px;') %}
          Câu bạn viết sẵn, được dùng nguyên văn khi tài liệu không có đoạn nào đủ liên quan và chế độ là "Từ chối lịch sự" hoặc khi đã hết số lượt hỏi làm rõ — AI không tự trả lời trong trường hợp đó. Để trống: dùng câu mặc định của hệ thống.
        {% endcall %}
        <textarea class="field" id="low_confidence_decline_message" name="low_confidence_decline_message" rows="2" maxlength="{{ engine.message_max }}" style="resize:vertical;">{{ settings.low_confidence_decline_message or "" }}</textarea>
      </div>

      <div class="cost-box" id="cost-box" data-url="{{ url_for('dashboard.bot_cost_estimate', bot_id=bot.id) }}" aria-live="polite">
        <div class="cost-head">
          <span>Chi phí ước tính mỗi câu hỏi</span>
          {% call tip('tip-cost', 'Chi phí ước tính mỗi câu hỏi') %}
            Tính theo cấu hình đang chọn (chưa cần lưu) với bảng giá DeepSeek Flash, quy đổi 1 USD ≈ 26.200 VND; đổi cấu hình thì con số đổi theo.
            <span class="tip-line"><b>Thấp nhất:</b> đầu hội thoại, không tra cứu được tài liệu, câu hỏi và câu trả lời ngắn, phần chỉ dẫn cố định đã nằm trong bộ nhớ đệm (cache).</span>
            <span class="tip-line"><b>Cao nhất:</b> mọi phần ngữ cảnh (tóm tắt, bộ nhớ, tin gần đây, tài liệu) đầy tới trần cấu hình, câu trả lời dài tới mức tối đa, không trúng cache.</span>
            <span class="tip-line">Chi phí thật của mỗi câu hỏi nằm giữa hai mức. Đây là ước lượng: số token thật do DeepSeek tính.</span>
          {% endcall %}
        </div>
        <div id="cost-body">
          <div class="cost-grid">
            <div><div class="cost-cell-label">Ngoài giờ cao điểm</div><div class="cost-cell-val" id="cost-off">Đang tính…</div></div>
            <div><div class="cost-cell-label">Giờ cao điểm</div><div class="cost-cell-val dim" id="cost-peak">…</div></div>
          </div>
          <div class="cost-sub" id="cost-sub"></div>
          <details class="cost-details">
            <summary>Chi tiết cách tính</summary>
            <div class="cost-detail-body">
              <table class="cost-table">
                <thead><tr><th>Token mỗi câu hỏi</th><th>Thấp nhất</th><th>Cao nhất</th></tr></thead>
                <tbody id="cost-rows"></tbody>
              </table>
              <ul class="cost-notes" id="cost-notes"></ul>
            </div>
          </details>
        </div>
        <div class="cost-err" id="cost-err" role="alert" hidden></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Chuyển tiếp &amp; thu thập dữ liệu</div>
      <div class="toggle-row">
        <div>
          <div class="toggle-row-title">Chuyển tiếp cho nhân viên khi AI không trả lời được</div>
          <div class="toggle-row-desc">Tự động đẩy hội thoại vào Inbox</div>
        </div>
        <input type="checkbox" id="forward_to_staff" name="forward_to_staff" {{ "checked" if settings.forward_to_staff else "" }} style="display:none;">
        <button type="button" class="toggle {{ 'on' if settings.forward_to_staff else '' }}" data-toggle-target="forward_to_staff"><div class="dot"></div></button>
      </div>
      <div class="toggle-row">
        <div>
          <div class="toggle-row-title">Thu thập thông tin khách hàng</div>
          <div class="toggle-row-desc">Tên, số điện thoại, email trong hội thoại</div>
        </div>
        <input type="checkbox" id="collect_customer_info" name="collect_customer_info" {{ "checked" if settings.collect_customer_info else "" }} style="display:none;">
        <button type="button" class="toggle {{ 'on' if settings.collect_customer_info else '' }}" data-toggle-target="collect_customer_info"><div class="dot"></div></button>
      </div>
      <div style="margin-top:14px;">
        <label class="lbl" for="away_message">Tin nhắn khi vắng mặt nhân viên</label>
        <textarea class="field" id="away_message" name="away_message" rows="2" style="resize:vertical;">{{ settings.away_message or "" }}</textarea>
      </div>
    </div>
  </div>

</form>
<script type="application/json" id="tpl-data">{{ template_data|tojson }}</script>
{% endblock %}
{% block footer_right %}
<a href="{{ url_for('dashboard.bot_knowledge', bot_id=bot.id) }}" class="btnp">Tiếp theo: Cơ sở tri thức →</a>
{% endblock %}
{% block workspace_extra_js %}
<script>
(function () {
  var MAX_CHARS = {{ instructions_max }};
  var CSRF = '{{ csrf_token }}';

  function byId(id) { return document.getElementById(id); }

  // ---------------- Công tắc và thanh trượt ----------------
  document.querySelectorAll('[data-toggle-target]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = byId(btn.dataset.toggleTarget);
      input.checked = !input.checked;
      btn.classList.toggle('on', input.checked);
      input.dispatchEvent(new Event('change', { bubbles: true }));  // để ô chi phí ước tính cập nhật
    });
  });
  function bindSlider(inputId, valueId, digits) {
    var input = byId(inputId), out = byId(valueId);
    if (input && out) input.addEventListener('input', function () { out.textContent = parseFloat(input.value).toFixed(digits); });
  }
  bindSlider('max_tokens', 'max_tokens-value', 0);
  bindSlider('temperature', 'temperature-value', 1);
  bindSlider('rag_distance_threshold', 'rag_distance_threshold-value', 2);

  // Mức cấu hình: chỉ hiện các thông số thuộc mức đang chọn; ô bị ẩn bị vô hiệu hóa để không gửi lên (server cũng bỏ qua)
  var tierSelect = byId('config_tier');
  var tierDesc = byId('tier-desc');
  function applyTier() {
    var tier = tierSelect.value;
    tierDesc.textContent = tierSelect.options[tierSelect.selectedIndex].dataset.desc || '';
    document.querySelectorAll('#engine-card [data-tiers]').forEach(function (section) {
      var visible = section.dataset.tiers.split(' ').indexOf(tier) !== -1;
      section.hidden = !visible;
      section.querySelectorAll('input,select,textarea').forEach(function (el) { el.disabled = !visible; });
    });
  }
  tierSelect.addEventListener('change', applyTier);
  applyTier();

  // ---------------- Chi phí ước tính mỗi câu hỏi ----------------
  // Server tính (cùng phép kiểm tra + quy tắc tier như lúc lưu) từ cấu hình đang chọn trên form; chưa lưu cũng cập nhật.
  var setupForm = byId('setup-form'), costBox = byId('cost-box');
  var costSeq = 0, costTimer = null;
  function fmtVnd(n) {
    var d = n < 10 ? 2 : n < 100 ? 1 : 0;
    return n.toLocaleString('vi-VN', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function fmtInt(n) { return Math.round(n).toLocaleString('vi-VN'); }
  function range(lo, hi, fmt) { return fmt(lo) + ' – ' + fmt(hi); }
  function addRow(tbody, cells, cls) {
    var tr = document.createElement('tr');
    if (cls) tr.className = cls;
    cells.forEach(function (text, i) {
      var cell = document.createElement(i === 0 && cls === 'total' ? 'th' : 'td');
      cell.textContent = text;
      tr.appendChild(cell);
    });
    tbody.appendChild(tr);
  }
  function showCostError(text) {
    costBox.classList.remove('loading');
    byId('cost-body').hidden = true;
    var err = byId('cost-err');
    err.textContent = text;
    err.hidden = false;
  }
  function renderCost(d) {
    var lo = d.question.min, hi = d.question.max;
    byId('cost-err').hidden = true;
    byId('cost-body').hidden = false;
    costBox.classList.remove('loading');
    byId('cost-off').textContent = range(lo.vnd.off_peak, hi.vnd.off_peak, fmtVnd) + ' VND';
    byId('cost-peak').textContent = range(lo.vnd.peak, hi.vnd.peak, fmtVnd) + ' VND';
    byId('cost-sub').textContent = '1.000 câu hỏi ≈ ' + range(lo.vnd.off_peak * 1000, hi.vnd.off_peak * 1000, fmtInt) + ' VND (ngoài giờ cao điểm).';

    var rows = byId('cost-rows');
    rows.textContent = '';
    d.components.forEach(function (c) { addRow(rows, [c.label, fmtInt(c.min), fmtInt(c.max)]); });
    addRow(rows, ['Tổng đầu vào', fmtInt(lo.input), fmtInt(hi.input)], 'total');
    addRow(rows, ['— trong đó trúng cache', fmtInt(lo.cache_hit), fmtInt(hi.cache_hit)]);
    addRow(rows, ['Đầu ra (câu trả lời + dữ liệu có cấu trúc)', fmtInt(lo.output), fmtInt(hi.output)], 'total');

    var notes = [
      'Thấp nhất: đầu hội thoại (chưa có tóm tắt, bộ nhớ, tin cũ), không tra cứu được tài liệu, câu hỏi và câu trả lời ngắn, phần chỉ dẫn cố định (' + fmtInt(d.components[0].min) + ' token) trúng cache.',
      'Cao nhất: mọi phần ngữ cảnh đầy tới trần cấu hình, câu trả lời dài tới “Token đầu ra tối đa”, không trúng cache.',
      'Hiếm khi AI phải gọi lại (kết quả sai định dạng hoặc tra cứu lại lịch sử hội thoại): cộng thêm tối đa ≈ ' + fmtVnd(d.extra_call_max.off_peak) + ' VND (ngoài cao điểm) / ' + fmtVnd(d.extra_call_max.peak) + ' VND (cao điểm).'
    ];
    if (d.summary_job) {
      notes.push('Tóm tắt nền chạy khi các tin chưa tóm tắt vượt ' + fmtInt(d.summary_job.trigger_tokens) + ' token, không tính vào từng câu hỏi: ≈ ' +
        range(d.summary_job.min.vnd.off_peak, d.summary_job.max.vnd.off_peak, fmtVnd) + ' VND mỗi lần (ngoài cao điểm).');
    }
    if (d.over_budget) {
      notes.push('Chỉ dẫn, tóm tắt, bộ nhớ và tin gần đây ở mức tối đa đã vượt “Tổng ngân sách ngữ cảnh”: hệ thống sẽ nén bớt, số liệu cao nhất bị chặn ở mức ngân sách.');
    }
    notes.push('Giờ cao điểm: ' + d.peak_hours + '. Tỷ giá tham chiếu 1 USD ≈ ' + fmtInt(d.usd_to_vnd) + ' VND; số token là ước lượng.');
    var list = byId('cost-notes');
    list.textContent = '';
    notes.forEach(function (text) {
      var li = document.createElement('li');
      li.textContent = text;
      list.appendChild(li);
    });
  }
  function refreshCost() {
    var seq = ++costSeq;  // bỏ qua phản hồi cũ đến muộn hơn phản hồi mới
    costBox.classList.add('loading');
    fetch(costBox.dataset.url, {
      method: 'POST',
      headers: { 'X-CSRF-Token': CSRF, 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(new FormData(setupForm))
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, data: data }; });
    }).then(function (res) {
      if (seq !== costSeq) return;
      if (res.ok) renderCost(res.data); else showCostError(res.data.error || 'Không tính được chi phí.');
    }).catch(function () {
      if (seq === costSeq) showCostError('Không tính được chi phí lúc này.');
    });
  }
  function scheduleCost() {
    clearTimeout(costTimer);
    costTimer = setTimeout(refreshCost, 350);
  }
  function affectsCost(el) { return el.id === 'instructions' || !!(el.closest && el.closest('#engine-card')); }
  ['input', 'change'].forEach(function (type) {
    setupForm.addEventListener(type, function (e) { if (affectsCost(e.target)) scheduleCost(); });
  });
  refreshCost();

  // ---------------- Trình soạn chỉ dẫn (markdown) ----------------
  var ta = byId('instructions');
  var mirror = byId('ed-mirror');
  var gutter = byId('ed-gutter');
  var counter = byId('ins-count');
  var msg = byId('ed-msg');
  var scheduled = false;

  function refreshGutter() {
    // Mỗi dòng logic có 1 hàng số; chiều cao lấy từ bản sao ẩn của textarea để dòng tự xuống hàng vẫn khớp số dòng
    mirror.style.width = ta.clientWidth + 'px';
    mirror.textContent = '';
    var lines = ta.value.split('\n');
    lines.forEach(function (line) {
      var row = document.createElement('div');
      row.textContent = line === '' ? '​' : line;
      mirror.appendChild(row);
    });
    gutter.textContent = '';
    for (var i = 0; i < mirror.children.length; i++) {
      var num = document.createElement('div');
      num.textContent = String(i + 1);
      num.style.height = mirror.children[i].offsetHeight + 'px';
      gutter.appendChild(num);
    }
    syncScroll();
  }
  function syncScroll() { gutter.style.transform = 'translateY(' + (-ta.scrollTop) + 'px)'; }

  function refreshCounter() {
    var n = ta.value.length;
    counter.textContent = n + ' / ' + MAX_CHARS + ' ký tự';
    counter.className = 'counter' + (n === 0 ? '' : n >= MAX_CHARS ? ' over' : n >= MAX_CHARS * 0.9 ? ' warn' : ' ok');
  }
  function refresh() {
    refreshCounter();
    if (scheduled) return;
    scheduled = true;
    // setTimeout thay vì requestAnimationFrame: rAF không chạy khi tab ở nền nên cột số dòng sẽ lệch
    setTimeout(function () { scheduled = false; refreshGutter(); }, 0);
  }
  ta.addEventListener('input', refresh);
  ta.addEventListener('scroll', syncScroll);
  window.addEventListener('resize', refresh);
  if (window.ResizeObserver) new ResizeObserver(refresh).observe(byId('ed-area'));

  function setMessage(text, kind, undoFn) {
    msg.textContent = text || '';
    msg.className = 'ed-msg' + (kind ? ' ' + kind : '');
    msg.hidden = !text;
    if (text && undoFn) {
      var undo = document.createElement('button');
      undo.type = 'button';
      undo.textContent = 'Hoàn tác';
      undo.addEventListener('click', function () { undoFn(); setMessage('Đã hoàn tác.', 'ok'); });
      msg.appendChild(undo);
    }
  }

  // Thay đoạn [start, end) bằng text rồi chọn [selStart, selEnd); ưu tiên execCommand để giữ được Ctrl+Z
  function replaceRange(start, end, text, selStart, selEnd) {
    ta.focus();
    ta.setSelectionRange(start, end);
    var done = false;
    try { done = document.execCommand('insertText', false, text); } catch (e) { done = false; }
    if (!done) {
      ta.setRangeText(text, start, end, 'end');
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    }
    ta.setSelectionRange(selStart, selEnd);
  }
  // Đặt toàn bộ nội dung (điền mẫu, kết quả Tối ưu, hoàn tác)
  function setAll(text) { replaceRange(0, ta.value.length, text, text.length, text.length); ta.scrollTop = 0; refresh(); }

  function wrap(before, after, placeholder) {
    var s = ta.selectionStart, e = ta.selectionEnd, chosen = ta.value.slice(s, e);
    var inner = chosen || placeholder;
    replaceRange(s, e, before + inner + after, s + before.length, s + before.length + inner.length);
  }
  function lineBounds() {
    var v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
    if (e > s && v.charAt(e - 1) === '\n') e -= 1;  // chọn tới cuối dòng có ký tự xuống dòng thì không tính dòng kế tiếp
    var ls = v.lastIndexOf('\n', s - 1) + 1;
    var le = v.indexOf('\n', e);
    return { start: ls, end: le < 0 ? v.length : le };
  }
  function mapLines(fn) {
    var b = lineBounds();
    var lines = ta.value.slice(b.start, b.end).split('\n');
    var out = fn(lines).join('\n');
    replaceRange(b.start, b.end, out, b.start, b.start + out.length);
  }
  function toggleLinePrefix(prefixFn, testRe) {
    mapLines(function (lines) {
      var allHave = lines.every(function (l) { return l.trim() === '' || testRe.test(l); });
      return lines.map(function (l, i) {
        if (allHave) return l.replace(testRe, '');
        return prefixFn(l.replace(testRe, ''), i);
      });
    });
  }

  var COMMANDS = {
    bold: function () { wrap('**', '**', 'chữ đậm'); },
    italic: function () { wrap('*', '*', 'chữ nghiêng'); },
    ul: function () { toggleLinePrefix(function (l) { return '- ' + l; }, /^\s*[-*]\s+(?!\[[ xX]\])/); },
    ol: function () { toggleLinePrefix(function (l, i) { return (i + 1) + '. ' + l; }, /^\s*\d+\.\s+/); },
    task: function () { toggleLinePrefix(function (l) { return '- [ ] ' + l; }, /^\s*-\s+\[[ xX]\]\s+/); },
    quote: function () { toggleLinePrefix(function (l) { return '> ' + l; }, /^\s*>\s?/); },
    link: function () {
      var s = ta.selectionStart, e = ta.selectionEnd, label = ta.value.slice(s, e) || 'văn bản liên kết';
      var text = '[' + label + '](https://)';
      var urlStart = s + label.length + 3;
      replaceRange(s, e, text, urlStart, urlStart + 8);
    },
    code: function () { wrap('`', '`', 'mã'); },
    codeblock: function () {
      var s = ta.selectionStart, e = ta.selectionEnd, chosen = ta.value.slice(s, e) || 'mã';
      var lead = (s > 0 && ta.value.charAt(s - 1) !== '\n') ? '\n' : '';
      var text = lead + '```\n' + chosen + '\n```\n';
      var from = s + lead.length + 4;
      replaceRange(s, e, text, from, from + chosen.length);
    },
    table: function () {
      var s = ta.selectionStart, e = ta.selectionEnd;
      var lead = (s > 0 && ta.value.charAt(s - 1) !== '\n') ? '\n' : '';
      var text = lead + '| Cột 1 | Cột 2 |\n| --- | --- |\n| Nội dung | Nội dung |\n';
      replaceRange(s, e, text, s + text.length, s + text.length);
    }
  };
  document.querySelectorAll('.ed-btn').forEach(function (btn) {
    btn.addEventListener('mousedown', function (ev) { ev.preventDefault(); });  // giữ vùng chọn trong textarea
    btn.addEventListener('click', function () { COMMANDS[btn.dataset.cmd](); });
  });
  byId('ed-heading').addEventListener('change', function (ev) {
    var level = parseInt(ev.target.value, 10) || 0;
    mapLines(function (lines) {
      return lines.map(function (l) {
        var plain = l.replace(/^\s{0,3}#{1,6}\s+/, '');
        return level ? new Array(level + 1).join('#') + ' ' + plain : plain;
      });
    });
    ev.target.value = 'p';
    ta.focus();
  });
  ta.addEventListener('keydown', function (ev) {
    if (!(ev.ctrlKey || ev.metaKey) || ev.shiftKey || ev.altKey) return;
    var key = ev.key.toLowerCase();
    if (key === 'b') { ev.preventDefault(); COMMANDS.bold(); }
    if (key === 'i') { ev.preventDefault(); COMMANDS.italic(); }
  });

  // Thu gọn/mở rộng khung chỉ dẫn
  var insToggle = byId('ins-toggle'), insBody = byId('ins-body');
  function setInsOpen(open) {
    insBody.hidden = !open;
    insToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) refresh();
  }
  insToggle.addEventListener('click', function () { setInsOpen(insBody.hidden); });

  // ---------------- Nút Tối ưu ----------------
  var optimizeBtn = byId('ins-optimize'), optimizeLabel = byId('ins-optimize-label');
  optimizeBtn.addEventListener('click', function () {
    var original = ta.value;
    if (!original.trim()) { setMessage('Chưa có chỉ dẫn để tối ưu. Hãy chọn một mẫu hoặc tự viết trước.', 'err'); return; }
    optimizeBtn.disabled = true;
    optimizeLabel.textContent = 'Đang tối ưu…';
    setMessage('');
    fetch(optimizeBtn.dataset.url, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
      body: JSON.stringify({ instructions: original })
    })
      .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
      .then(function (res) {
        if (!res.ok) { setMessage(res.body.error || 'Không tối ưu được chỉ dẫn.', 'err'); return; }
        setAll(res.body.instructions);
        setMessage('Đã tối ưu chỉ dẫn — xem lại rồi bấm "Lưu thay đổi".', 'ok', function () { setAll(original); });
      })
      .catch(function () { setMessage('Không kết nối được máy chủ. Hãy thử lại.', 'err'); })
      .then(function () { optimizeBtn.disabled = false; optimizeLabel.textContent = 'Tối ưu'; });
  });

  // ---------------- Chọn mẫu trợ lý ----------------
  var TEMPLATES = JSON.parse(byId('tpl-data').textContent);
  var cards = document.querySelectorAll('.tpl[data-key]');
  var grid = byId('tpl-grid'), showBtn = byId('tpl-show'), note = byId('tpl-note');
  var greeting = byId('greeting'), temperature = byId('temperature');

  function setGridOpen(open) {
    grid.hidden = !open;
    showBtn.hidden = open;
    try { localStorage.setItem('setup_templates_collapsed', open ? '0' : '1'); } catch (e) { /* bỏ qua: chỉ là tiện ích ghi nhớ */ }
  }
  try { if (localStorage.getItem('setup_templates_collapsed') === '1') setGridOpen(false); } catch (e) { /* localStorage bị chặn */ }
  byId('tpl-hide').addEventListener('click', function () { setGridOpen(false); });
  showBtn.addEventListener('click', function () { setGridOpen(true); });

  function showNote(text) { note.textContent = text; note.hidden = false; }

  cards.forEach(function (card) {
    card.addEventListener('click', function () {
      var t = TEMPLATES[card.dataset.key];
      if (!t) return;
      if (t.instructions !== null) {
        var hasOwn = (ta.value.trim() && ta.value.trim() !== t.instructions.trim()) ||
                     (greeting.value.trim() && greeting.value.trim() !== (t.greeting || '').trim());
        if (hasOwn && !window.confirm('Áp dụng mẫu "' + t.name + '" sẽ thay lời chào, chỉ dẫn và độ sáng tạo đang có. Chưa có gì được lưu cho tới khi bạn bấm "Lưu thay đổi". Tiếp tục?')) return;
      }
      cards.forEach(function (c) { c.setAttribute('aria-pressed', c === card ? 'true' : 'false'); });
      setInsOpen(true);
      if (t.instructions === null) {
        showNote('Đã chọn "' + t.name + '": tự viết chỉ dẫn của bạn ở khung "Tùy chỉnh trợ lý của bạn" bên dưới.');
      } else {
        greeting.value = t.greeting;
        setAll(t.instructions);
        if (t.temperature !== null) {
          temperature.value = t.temperature;
          temperature.dispatchEvent(new Event('input', { bubbles: true }));
        }
        setMessage('');
        showNote('Đã áp dụng mẫu "' + t.name + '": chỉ dẫn tối ưu nằm ở khung "Tùy chỉnh trợ lý của bạn" bên dưới. Xem lại, chỉnh theo doanh nghiệp rồi bấm "Lưu thay đổi".');
      }
      byId('ins-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
      ta.focus({ preventScroll: true });
    });
  });

  refresh();
})();
</script>
{% endblock %}
